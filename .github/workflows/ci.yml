name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
      # --locked fails if uv.lock has drifted from pyproject.toml, so the
      # lockfile can never silently go stale.
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Black
        run: uv run black --check src tests scripts
      - name: Mypy
        run: uv run mypy

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Pytest with coverage
        run: uv run pytest --cov=caust --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  determinism:
    name: Results reproduce byte-for-byte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
      # Runtime dependencies only, exactly as pinned in uv.lock.
      - name: Install
        run: uv sync --locked --no-dev
      # Two separate processes, so anything that leaks across a single
      # interpreter (global RNG state, cached imports) cannot hide a difference.
      - name: Run the same config twice in separate processes
        run: |
          uv run --no-sync caust run -c configs/experiment/smoke.yaml -o run_a
          uv run --no-sync caust run -c configs/experiment/smoke.yaml -o run_b
      - name: Artifacts must be byte-identical
        run: |
          # manifest.json is excluded: it records a timestamp and the machine's
          # own provenance, which legitimately differ between two runs.
          diff -r --exclude=manifest.json run_a run_b
      - name: Recorded config must still reproduce its metrics
        run: uv run --no-sync caust verify run_a/smoke-*/

  packaging:
    name: Distribution installs and tests clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*
      # The `test` job installs from the git checkout, so it cannot catch files
      # that are missing from the distribution (e.g. tests/conftest.py). Run the
      # shipped suite from the unpacked sdist instead.
      - name: Test from the unpacked sdist
        run: |
          mkdir -p /tmp/sd && tar -xzf dist/*.tar.gz -C /tmp/sd
          cd /tmp/sd/caust-*
          uv sync --locked
          uv run --no-sync pytest
      - name: Wheel imports and console script works
        run: |
          uv venv /tmp/wheelenv
          uv pip install --python /tmp/wheelenv/bin/python dist/*.whl
          cd /tmp
          /tmp/wheelenv/bin/python -c "import caust; print(caust.__version__)"
          /tmp/wheelenv/bin/caust demo --slices 2 --n-causal 4
