name: Release

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC), no API token needed
      contents: write  # attach the built sdist/wheel to the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.11"
      # PyPI permanently burns a version number on first upload, so a tag that
      # disagrees with pyproject.toml must fail before anything is published.
      - name: Verify the release tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run --no-project python -c "import re,pathlib;t=pathlib.Path('pyproject.toml').read_text();print(re.search(r'^version = \"([^\"]+)\"',t,re.M).group(1))")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag '$TAG' does not match pyproject version '$PKG'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build
      - name: Check artifacts
        run: uvx twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      # The same files PyPI received, attached to the release for anyone who
      # wants to verify a download against PyPI without pip.
      - name: Attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
