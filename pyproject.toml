[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caust"
version = "0.1.0"
description = "Causal Gene Intervention for Robust Spatial Domain Identification"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jiawei Li", email = "jli53355@usc.edu" }]
maintainers = [{ name = "Jiawei Li", email = "jli53355@usc.edu" }]
keywords = [
    "spatial-transcriptomics",
    "causal-inference",
    "gene-selection",
    "graph-neural-networks",
    "spatial-domain-identification",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0",
    "anndata>=0.8",
    "pyyaml>=6.0",
    # Pins the BLAS thread pool at runtime, which is what makes results
    # bitwise reproducible across machines with different core counts.
    "threadpoolctl>=3.1",
]

# User-facing optional features (installable from PyPI as caust[viz] etc.).
[project.optional-dependencies]
stagate = ["torch>=2.0", "scanpy>=1.9", "scikit-misc>=0.3"]
viz = ["matplotlib>=3.5"]

# Development tooling (PEP 735). Not part of the published package metadata;
# `uv sync` installs the `dev` group by default.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.0",
    "matplotlib>=3.5",
    "twine>=5.1.1",
    "types-PyYAML>=6.0",
]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0", "mkdocstrings[python]>=0.24"]

[project.scripts]
caust = "caust.cli:main"

[project.urls]
Homepage = "https://github.com/land-saas/CauSt"
Repository = "https://github.com/land-saas/CauSt"
Issues = "https://github.com/land-saas/CauSt/issues"
Changelog = "https://github.com/land-saas/CauSt/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

# On Linux (CI, Docker) take torch from PyTorch's CPU wheel index: the PyPI
# wheel drags in several GB of CUDA libraries that a CPU runner never uses.
# Only affects uv-managed environments of this project, not `pip install`.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.package-data]
caust = ["py.typed", "configs/*.yaml", "configs/**/*.yaml"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["caust"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.mypy]
# mypy >= 1.19 cannot target 3.9 anymore; real 3.9 compatibility is covered by
# the CI test matrix and ruff's target-version = "py39".
python_version = "3.10"
files = ["src/caust"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
no_implicit_optional = true
warn_return_any = true
